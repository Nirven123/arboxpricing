<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>הצעת מחיר אישית מ-Arbox</title>
<meta property="og:title" content="הצעת מחיר אישית מ-Arbox">
<meta property="og:description" content="ההצעה שהכנו בשבילך. אפשר לבחור בה סוג חיוב, סליקה ותוספים, והמחיר מתעדכן.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
:root{
  --navy:#081838;
  --blue:#4F87FF;
  --blue-ink:#2A5FD9;
  --peach:#FADAB3;
  --peach-soft:#FDF1E2;
  --paper:#F4F6FA;
  --line:#E1E6EF;
  --muted:#5A6377;
  --white:#FFFFFF;
  --wa:#0B6E5F;
  --wa-bg:#EFE8DE;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--navy);font-size:16px;line-height:1.6}
img{max-width:100%;display:block}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:6px}

.wrap{max-width:1160px;margin:0 auto;padding-inline:24px}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:24px 0}
.logo{height:30px;width:auto}
.top-meta{font-size:14px;color:var(--muted);text-align:end;line-height:1.5}
.expired{background:var(--navy);color:#fff;padding:12px 24px;text-align:center;font-weight:500}

/* hero: the client's name carries the page */
.hero{padding-block:56px 44px}
.hero h1{font-size:clamp(40px,7.2vw,88px);font-weight:900;line-height:1.02;letter-spacing:-.03em;max-width:16ch;text-wrap:balance}
.hero-people{margin-top:18px;font-size:17px;color:var(--muted)}
.hero-people strong{color:var(--navy);font-weight:700}
.intro{margin-top:22px;font-size:19px;line-height:1.7;max-width:62ch;color:#26314d}

/* deal area */
.deal{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;align-items:start;padding-bottom:72px}
.block{padding-block:32px;border-top:1px solid var(--line)}
.block:first-child{border-top:none;padding-top:0}
.block h2{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.block .sub{color:var(--muted);margin-top:4px}
.block-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}

/* billing switch */
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;opacity:0;cursor:pointer}
.seg span{display:block;padding:9px 20px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.seg input:checked+span{background:var(--navy);color:#fff}
.seg input:focus-visible+span{outline:2.5px solid var(--blue);outline-offset:2px}
.save-note{font-size:14px;color:var(--blue-ink);font-weight:500;margin-top:8px}

/* package + explained features */
.pkg{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:26px 28px}
.pkg-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.pkg-head h3{font-size:30px;font-weight:900;letter-spacing:-.02em}
.pkg-price{font-size:22px;font-weight:800}
.pkg-price .u{font-size:14px;font-weight:500;color:var(--muted)}
.feats-title{font-size:16px;font-weight:800;margin-bottom:14px}
.feats{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:18px 32px}
.feats li{display:flex;gap:12px;align-items:flex-start}
.feats .ic{flex-shrink:0;width:22px;height:22px;margin-top:1px}
.feat-t{font-weight:700;font-size:15.5px;line-height:1.35}
.feat-t .val{color:var(--blue-ink)}
.feat-d{font-size:14px;color:var(--muted);line-height:1.5;margin-top:3px}
.not-incl{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.not-incl strong{color:var(--navy);font-weight:700}

/* option cards (payment + add-ons) */
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.opt:hover{border-color:#b9c6e4}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt.is-on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.opt:has(input:focus-visible){outline:2.5px solid var(--blue);outline-offset:3px}
.opt-main{flex:1;min-width:0}
.opt-name{display:block;font-weight:700;font-size:16px;line-height:1.35}
.opt-note{display:block;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.5}
.opt-unit{display:block;font-size:13px;color:var(--blue-ink);margin-top:3px}
.opt-price{font-weight:800;white-space:nowrap;font-size:16px}
.opt-price .u{font-weight:500;font-size:13px;color:var(--muted)}
.opt.static{cursor:default}
.mark{flex-shrink:0;width:22px;height:22px;border:1.5px solid #b5bfd3;margin-top:1px;display:grid;place-items:center;transition:background .2s,border-color .2s}
.mark.radio{border-radius:50%}
.mark.check{border-radius:7px}
.opt.is-on .mark{background:var(--navy);border-color:var(--navy)}
.mark svg{width:13px;height:13px;opacity:0;transition:opacity .15s}
.opt.is-on .mark svg{opacity:1}
.mark.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;opacity:0}
.opt.is-on .mark.radio::after{opacity:1}
.bill-note{display:flex;gap:10px;align-items:flex-start;background:var(--peach-soft);border:1px solid #F1D6B4;border-radius:14px;padding:12px 16px;font-size:14.5px;line-height:1.55;margin-bottom:14px}
.bill-note svg{flex-shrink:0;margin-top:2px}

/* fixed lines + one-time */
.lines{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lines .ln{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid var(--line)}
.lines .ln:first-child{border-top:none}
.lines .ln b{font-weight:800;white-space:nowrap}
.onetime{background:var(--peach-soft);border-color:#F1D6B4}
.onetime .ln{border-color:#F1D6B4}
.onetime .tot{background:var(--peach);font-weight:800}
.note{background:var(--white);border-inline-start:4px solid var(--blue);border-radius:4px 14px 14px 4px;padding:16px 20px;line-height:1.7}
[dir=rtl] .note{border-radius:14px 4px 4px 14px}

/* summary card: the one loud object on the page, lit by the logo's own gradient */
.sum-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px)}
.sum{position:relative;overflow:hidden;isolation:isolate;background:var(--navy);color:#fff;border-radius:28px;padding:30px 28px 26px}
.sum::before{content:"";position:absolute;z-index:-1;width:300px;height:300px;inset-block-start:-185px;inset-inline-end:-175px;background:radial-gradient(circle at center,#FADAB3 0%,#F6C9A0 20%,#4F87FF 55%,rgba(79,135,255,0) 72%);opacity:.85;filter:blur(4px)}
.sum-plan{font-size:15px;color:#c9d4ee;font-weight:500}
.sum-price{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.sum-price .num{font-size:60px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.sum-price .unit{font-size:15px;color:#c9d4ee}
.sum-was{font-size:15px;color:#9fb0d6;text-decoration:line-through;margin-top:6px}
.sum-deal{margin-top:10px;font-size:15px;line-height:1.5;color:var(--peach);font-weight:500}
.sum-annual{margin-top:8px;font-size:15px;color:#dbe3f5}
.sum-list{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);display:grid;gap:8px;font-size:14.5px}
.r{display:flex;justify-content:space-between;gap:12px;color:#dbe3f5}
.r span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.r.disc{color:var(--peach)}
.sum-ad{margin-top:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 16px;display:grid;gap:7px;font-size:14px}
.sum-ad h4{font-size:15px;font-weight:800;color:#fff}
.sum-ad .hint{font-size:12.5px;color:#9fb0d6;margin-top:-4px;margin-bottom:2px}
.sum-ad .tot{color:#fff;font-weight:800;border-top:1px solid rgba(255,255,255,.14);padding-top:8px;margin-top:2px}
.sum-ad .grand{color:var(--peach);font-weight:700}
.sum-extra{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;color:#c9d4ee;display:grid;gap:6px}
.sum-extra strong{color:#fff;font-weight:700}
.vat-row{position:relative;margin-top:18px;display:flex;align-items:center;gap:10px;font-size:14.5px;color:#dbe3f5;cursor:pointer;width:fit-content}
.vat-row input{position:absolute;opacity:0;width:1px;height:1px}
.toggle{width:40px;height:24px;border-radius:999px;background:rgba(255,255,255,.22);position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.vat-row input:checked+.toggle{background:var(--blue)}
.vat-row input:checked+.toggle::after{transform:translateX(16px)}
[dir=rtl] .vat-row input:checked+.toggle::after{transform:translateX(-16px)}
.vat-row input:focus-visible+.toggle{outline:2.5px solid var(--peach);outline-offset:2px}
.cta{display:block;margin-top:22px;background:var(--peach);color:var(--navy);text-align:center;text-decoration:none;font-weight:800;font-size:18px;padding:16px 20px;border-radius:16px;transition:transform .15s,background .2s}
.cta:hover{background:#fde6c9}
.cta:active{transform:scale(.98)}
.cta:focus-visible{outline-color:#fff}
.cta-sub{font-size:13px;color:#9fb0d6;text-align:center;margin-top:8px}
.pdf-btn{display:block;width:100%;margin-top:12px;background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:14px;padding:11px;font-weight:700;font-size:15px;cursor:pointer}
.pdf-btn:hover{background:rgba(255,255,255,.08)}

/* ── showcases ── */
.showcase{padding-block:80px 40px;border-top:1px solid var(--line)}
.showcase-head h2{font-size:clamp(30px,4.4vw,48px);font-weight:900;letter-spacing:-.025em;line-height:1.1;max-width:18ch}
.showcase-head p{color:var(--muted);font-size:18px;margin-top:12px;max-width:52ch}
.show[hidden]{display:none!important}
.show{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:64px;align-items:center;padding-block:64px;border-top:1px solid var(--line)}
.showcase-head+.show{border-top:none}
.show.flip .show-dev{order:-1}
.tag{display:inline-block;font-size:13.5px;font-weight:700;color:var(--blue-ink);background:#E5EDFF;border-radius:999px;padding:3px 12px;margin-bottom:14px}
.tag.add{color:#8a5a1f;background:var(--peach-soft)}
.show h3{font-size:clamp(24px,3vw,32px);font-weight:900;letter-spacing:-.02em;line-height:1.2;max-width:20ch}
.show .lead{font-size:17px;color:#26314d;margin-top:12px;max-width:46ch;line-height:1.7}
.show ul{list-style:none;margin-top:18px;display:grid;gap:9px}
.show li{display:flex;gap:10px;font-size:15.5px;line-height:1.5}
.show li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:9px;flex-shrink:0}
.show-actions{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:24px;align-items:center}
.chip-btn{border:1.5px solid var(--navy);background:transparent;border-radius:999px;padding:9px 18px;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s,color .2s}
.chip-btn.on{background:var(--navy);color:#fff}
.link-btn{background:none;border:none;color:var(--blue-ink);font-weight:700;font-size:15px;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.try{font-size:14.5px;color:var(--blue-ink);font-weight:500}
.demo-note{font-size:12.5px;color:#98a0b3;margin-top:14px}
.swatches{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;transition:transform .15s}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--navy);transform:scale(1.08)}

/* phone */
.show-dev{display:flex;justify-content:center}
.phone{width:290px;height:600px;background:#0D1526;border-radius:46px;padding:11px;position:relative;flex-shrink:0;box-shadow:0 46px 80px -34px rgba(8,24,56,.55),inset 0 0 0 1.5px #2b3858}
.scr{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff;display:flex;flex-direction:column;font-size:13.5px;line-height:1.4}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:88px;height:26px;border-radius:20px;background:#000;z-index:20}
.sbar{direction:ltr;height:46px;flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 6px;font-size:13px;font-weight:700;position:relative;z-index:2}
.sbar svg{height:11px;width:auto}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(8,24,56,.22);pointer-events:none;opacity:0;transform:scale(.4);z-index:30}
.tap.go{animation:tap .55s ease-out}
@keyframes tap{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.4)}}

/* booking app */
.ab-head{padding:6px 18px 10px}
.ab-studio{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-title{font-size:22px;font-weight:900;letter-spacing:-.02em}
.ab-days{display:flex;gap:6px;padding:0 14px 12px}
.ab-day{flex:1;text-align:center;border-radius:12px;padding:6px 0;background:#F1F4F9;font-size:11.5px;color:var(--muted)}
.ab-day b{display:block;font-size:16px;color:var(--navy)}
.ab-day.on{background:var(--navy);color:#c9d4ee}
.ab-day.on b{color:#fff}
.ab-list{flex:1;padding:0 12px;display:grid;gap:9px;align-content:start}
.cls{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.cls-time{font-weight:800;font-size:14px;width:42px;flex-shrink:0;text-align:center}
.cls-main{flex:1;min-width:0}
.cls-name{font-weight:700;font-size:13.5px}
.cls-meta{font-size:11.5px;color:var(--muted)}
.cls-btn{border:none;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;background:var(--blue);color:#fff;cursor:pointer;white-space:nowrap;transition:background .2s}
.cls-btn.done{background:#E3F6EA;color:#137a3a}
.cls-btn:disabled{background:#EEF0F4;color:#98a0b3;cursor:default}
.toast{position:absolute;inset-inline:12px;bottom:18px;background:var(--navy);color:#fff;border-radius:14px;padding:11px 13px;font-size:12.5px;display:flex;gap:9px;align-items:center;transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:10}
.toast.show{transform:none}
.toast i{width:22px;height:22px;border-radius:50%;background:#2fb760;display:grid;place-items:center;flex-shrink:0;font-style:normal}

/* whatsapp-style chat */
.wa-head{background:var(--wa);color:#fff;display:flex;align-items:center;gap:9px;padding:8px 12px 10px;margin-top:-46px;padding-top:54px}
.wa-av{width:34px;height:34px;border-radius:50%;background:var(--peach);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:13px;flex-shrink:0}
.wa-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-sub{font-size:11px;opacity:.8}
.wa-body{flex:1;background:var(--wa-bg);padding:12px 10px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.wa-day{align-self:center;background:#fff;border-radius:8px;padding:2px 10px;font-size:11px;color:var(--muted);box-shadow:0 1px 1px rgba(0,0,0,.06)}
.bub{max-width:84%;background:#fff;border-radius:12px;padding:7px 10px 5px;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.08);align-self:flex-start;animation:pop .28s ease-out}
.bub.me{background:#DCF8C6;align-self:flex-end}
.bub time{display:block;text-align:end;font-size:10px;color:#8a94a6;margin-top:2px}
.bub .lnk{display:block;margin-top:6px;background:#F2F5F9;border-radius:9px;padding:8px 10px;font-weight:700;color:var(--navy);text-align:center;border:none;width:100%;cursor:pointer}
.typing{align-self:flex-start;background:#fff;border-radius:12px;padding:9px 12px;display:flex;gap:4px}
.typing span{width:6px;height:6px;border-radius:50%;background:#9aa3b5;animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-3px);opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

/* payment sheet */
.sheet{position:absolute;inset-inline:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px 20px;box-shadow:0 -12px 40px rgba(8,24,56,.22);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:12}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:#d5dbe6;margin:0 auto 12px}
.sh-merchant{font-size:12px;color:var(--muted);text-align:center}
.sh-amt{font-size:34px;font-weight:900;text-align:center;letter-spacing:-.02em;line-height:1.15}
.sh-desc{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:12px}
.sh-m{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px;cursor:pointer;width:100%;background:#fff;text-align:start;font-size:13px;font-weight:700}
.sh-m.on{border-color:var(--navy)}
.sh-m .ico{width:30px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:900;flex-shrink:0}
.sh-m .rd{margin-inline-start:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid #b5bfd3}
.sh-m.on .rd{border:5px solid var(--navy)}
.sh-pay{width:100%;margin-top:6px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;padding:12px;font-size:14.5px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sh-done{position:absolute;inset:0;background:#fff;border-radius:22px 22px 0 0;display:grid;place-items:center;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.sh-done.show{opacity:1;pointer-events:auto}
.ok-ring{width:62px;height:62px;border-radius:50%;background:#2fb760;display:grid;place-items:center;margin:0 auto 12px;transform:scale(.5);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.show .ok-ring.go,.sh-done.show .ok-ring{transform:none}
.sh-done b{display:block;font-size:17px}
.sh-done span{font-size:12.5px;color:var(--muted)}

/* access card */
.acc{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 20px 20px;background:linear-gradient(180deg,#fff 0%,#F3F6FB 100%)}
.acc-title{font-size:20px;font-weight:900;align-self:stretch}
.acc-sub{font-size:12px;color:var(--muted);align-self:stretch;margin-bottom:22px}
.qr-box{position:relative;width:196px;height:196px;padding:14px;background:#fff;border-radius:22px;box-shadow:0 10px 30px -12px rgba(8,24,56,.3);overflow:hidden}
.qr-box svg{width:100%;height:100%}
.beam{position:absolute;inset-inline:10px;height:3px;top:14px;border-radius:3px;background:var(--blue);box-shadow:0 0 14px 3px rgba(79,135,255,.55);opacity:0}
.beam.go{opacity:1;animation:beam 1.5s ease-in-out 2}
@keyframes beam{0%{top:14px}50%{top:178px}100%{top:14px}}
.acc-name{margin-top:20px;font-weight:800;font-size:16px}
.acc-plan{font-size:12.5px;color:var(--muted)}
.acc-ok{position:absolute;inset:0;background:#1f9d55;color:#fff;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .35s;z-index:15}
.acc-ok.show{opacity:1}
.acc-ok .ok-ring{background:#fff}
.acc-ok.show .ok-ring{transform:none}
.acc-ok b{display:block;font-size:22px;font-weight:900}
.acc-ok span{font-size:13.5px;opacity:.9}

/* branded app */
.br{--brand:#4F87FF;flex:1;display:flex;flex-direction:column;background:#F5F7FB;transition:--brand .3s}
.br-head{background:var(--brand);color:#fff;padding:54px 18px 22px;margin-top:-46px;border-radius:0 0 26px 26px;transition:background .35s}
.br-logo{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:15px;transition:color .35s}
.br-row{display:flex;gap:10px;align-items:center}
.br-name{font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-hi{margin-top:16px;font-size:20px;font-weight:900}
.br-next{margin:-14px 14px 0;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px -10px rgba(8,24,56,.25);position:relative}
.br-next small{font-size:11px;color:var(--muted)}
.br-next b{display:block;font-size:14px}
.br-next .pill{position:absolute;inset-inline-end:12px;top:14px;background:var(--brand);color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;transition:background .35s}
.br-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.br-tile{background:#fff;border-radius:14px;padding:12px;font-weight:700;font-size:12.5px}
.br-tile i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--brand) 15%,#fff);color:var(--brand);margin-bottom:8px;transition:background .35s,color .35s}
.br-tile i svg{width:17px;height:17px}
.br-tabs{margin-top:auto;display:flex;justify-content:space-around;padding:10px 0 16px;background:#fff;border-top:1px solid var(--line)}
.br-tabs span{width:22px;height:4px;border-radius:4px;background:#d5dbe6}
.br-tabs span:first-child{background:var(--brand)}

/* dashboard tablet */
.tab{width:min(560px,100%);aspect-ratio:4/3;background:#0D1526;border-radius:30px;padding:12px;box-shadow:0 46px 80px -34px rgba(8,24,56,.55),inset 0 0 0 1.5px #2b3858}
.dash{width:100%;height:100%;background:#fff;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.dash-top{display:flex;justify-content:space-between;align-items:baseline}
.dash-top b{font-size:18px;font-weight:900}
.dash-top span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:#F4F6FA;border-radius:14px;padding:10px 12px}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}
.kpi b{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi em{display:block;font-style:normal;font-size:11px;color:#1f9d55;font-weight:700}
.chart{flex:1;display:flex;align-items:flex-end;gap:12px;padding:8px 4px 0;border-bottom:1.5px solid var(--line);min-height:0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;max-width:38px;height:0;border-radius:8px 8px 3px 3px;background:#C9D8FF;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.bar:last-child i{background:var(--blue)}
.bar span{font-size:10.5px;color:var(--muted)}
.chart-l{display:flex;gap:12px;padding:0 4px}
.chart-l span{flex:1;text-align:center;font-size:10.5px;color:var(--muted)}

.ai{width:100%;height:100%;background:#fff;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;font-size:13.5px}
.ai-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.ai-who{display:flex;gap:9px;align-items:center;font-weight:800;font-size:15px}
.ai-av{width:28px;height:28px;border-radius:9px;background:var(--navy);color:var(--peach);display:grid;place-items:center;font-weight:900;font-size:14px}
.ai-conn{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--muted);background:#F1F4F9;border-radius:999px;padding:4px 10px 4px 8px;white-space:nowrap}
.ai-conn img{height:13px;width:auto}
.ai-conn i{width:7px;height:7px;border-radius:50%;background:#2fb760}
.ai-body{flex:1;overflow-y:auto;scrollbar-width:none;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.ai-body::-webkit-scrollbar{display:none}
.ai-u{align-self:flex-end;background:#EEF2F8;border-radius:16px;padding:8px 13px;max-width:82%;animation:pop .25s ease-out}
.ai-a{max-width:94%;line-height:1.6;animation:pop .25s ease-out}
.ai-tool{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12px;color:var(--muted);animation:pop .25s ease-out}
.ai-tool img{height:12px;width:auto}
.ai-tool .spin{width:12px;height:12px;border-color:#d5dbe6;border-top-color:var(--blue)}
.ai-tool .ok{color:#1f9d55;font-weight:900}
.ai-rows{display:grid;gap:5px;margin:6px 0}
.ai-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;background:#F7F9FC;border-radius:9px;padding:6px 10px;font-size:12.5px}
.ai-row b{font-weight:700}
.ai-row span{color:var(--muted)}
.ai-card{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-top:7px;max-width:290px}
.ai-cal{width:50px;height:46px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;font-size:10px;line-height:1.1;flex-shrink:0}
.ai-cal b{display:block;font-size:14px;font-weight:900}
.ai-card div:last-child b{display:block;font-size:13.5px}
.ai-card div:last-child span{display:block;font-size:12px;color:var(--muted)}
.ai-in{margin:0 14px 14px;border:1.5px solid var(--line);border-radius:14px;padding:9px 10px 9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px}
[dir=rtl] .ai-in{padding:9px 14px 9px 10px}
.ai-in .t{color:#98a0b3;flex:1}
.ai-in .t.on{color:var(--navy)}
.ai-in .t.on::after{content:"";display:inline-block;width:1.5px;height:15px;background:var(--navy);vertical-align:-3px;margin-inline-start:1px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.ai-send{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex-shrink:0}
.ai-send svg{width:14px;height:14px}
[dir=rtl] .ai-send svg{transform:scaleX(-1)}

/* content sections */
.story{background:var(--white);border-top:1px solid var(--line)}
.story .wrap{max-width:900px}
.part{padding-block:56px;border-top:1px solid var(--line)}
.part:first-child{border-top:none}
.part h2{font-size:clamp(26px,3.4vw,36px);font-weight:900;letter-spacing:-.02em;line-height:1.2;margin-bottom:22px}
.why p{font-size:17.5px;line-height:1.8;color:#26314d;max-width:66ch}
.why p+p{margin-top:14px}
.why h2+p{font-size:20px;color:var(--navy)}
.values{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:26px 40px}
.values li{border-top:2px solid var(--navy);padding-top:14px}
.values h3{font-size:18px;font-weight:800;margin-bottom:4px}
.values p{color:var(--muted);line-height:1.6}
.clients{font-size:clamp(20px,2.4vw,26px);font-weight:700;line-height:1.55;letter-spacing:-.01em;text-wrap:pretty}
.clients .nm{white-space:nowrap}
.clients .sep{color:#b5bfd3;font-weight:400}
.clients .more{color:var(--muted);font-weight:500}
.steps{list-style:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:16px;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding-top:52px;font-weight:700;font-size:16.5px;line-height:1.4}
.steps li::before{content:counter(st);position:absolute;top:0;inset-inline-start:0;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.steps li::after{content:"";position:absolute;top:19px;inset-inline-start:48px;inset-inline-end:-6px;height:2px;background:var(--line)}
.steps li:last-child::after{display:none}
details.small{border-top:1px solid var(--line);padding-block:22px}
details.small summary{cursor:pointer;font-weight:800;font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.small summary::-webkit-details-marker{display:none}
details.small summary::after{content:"+";font-size:24px;font-weight:400;color:var(--muted)}
details.small[open] summary::after{content:"−"}
details.small ul{margin-top:14px;padding-inline-start:20px;color:var(--muted);font-size:14.5px;line-height:1.8;display:grid;gap:4px}

.closing{background:var(--navy);color:#fff}
.closing .wrap{max-width:900px;padding-block:64px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
.closing p{color:#c9d4ee}
.closing .sign{font-size:24px;font-weight:800;color:#fff;margin-top:6px}
.closing .logo{height:26px;margin-top:22px}
.closing .cta{margin-top:0;padding-inline:32px}

.bar-m{display:none}
.invalid{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px}
.invalid p{margin-top:20px;font-size:18px;max-width:30ch}

@media (max-width:980px){
  .deal{grid-template-columns:1fr;gap:8px}
  .sum-wrap{position:static}
  .show{grid-template-columns:1fr;gap:36px;padding-block:52px}
  .show.flip .show-dev{order:0}
  .bar-m{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--navy);color:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -8px 30px rgba(8,24,56,.25);transition:transform .25s}
  .bar-m.hide{transform:translateY(110%)}
  .bar-m .p{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  .bar-m .p small{font-size:13px;font-weight:500;color:#c9d4ee}
  .bar-m .p .ad{display:block;font-size:12.5px;font-weight:500;color:var(--peach)}
  .bar-m button{background:var(--peach);color:var(--navy);border:none;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer}
  .closing .wrap{padding-bottom:140px}
}
@media (max-width:640px){
  .ai-top{padding:10px 12px}.ai-body{padding:12px}.ai-in{margin:0 10px 10px}.ai-conn span{display:none}
  .wrap{padding-inline:18px}
  .hero{padding-block:40px 32px}
  .intro{font-size:17px}
  .feats,.values,.opts.two{grid-template-columns:1fr}
  .pkg{padding:22px 20px}
  .steps{grid-auto-flow:row;gap:18px}
  .steps li{padding-top:4px;padding-inline-start:54px;min-height:38px}
  .steps li::after{display:none}
  .closing .wrap{grid-template-columns:1fr}
  .sum-price .num{font-size:52px}
  .showcase{padding-top:56px}
  .dash{padding:12px;gap:10px}
  .kpi b{font-size:15px}
  .kpi small{font-size:10px}
  .tab{aspect-ratio:3/3.2;border-radius:24px;padding:9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

@media print{
  @page{size:A4;margin:14mm}
  :root{padding:0}
  body{background:#fff;font-size:12.5px;padding:0!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar-m,.seg,.vat-row,.cta,.cta-sub,.pdf-btn,.no-print,.opt:not(.is-on),.showcase,.save-note,.closing .logo{display:none!important}
  .print-only{display:block!important}
  .hero{padding-block:18px 14px}
  .hero h1{font-size:34px}
  .intro{font-size:13.5px}
  .deal{display:block;padding-bottom:0}
  .sum-wrap{position:static;margin-top:16px;break-inside:avoid}
  .sum{border-radius:16px;padding:20px}
  .sum-price .num{font-size:40px}
  .block{padding-block:16px}
  .opt,.pkg,.lines,.feats li{break-inside:avoid}
  .feats{gap:10px 24px}
  .part{padding-block:22px;break-inside:avoid}
  .part h2{font-size:22px;margin-bottom:12px}
  .why p,.why h2+p{font-size:13px}
  .clients{font-size:16px}
  .closing{background:#fff;color:var(--navy);border-top:2px solid var(--navy)}
  .closing .wrap{padding-block:20px}
  .closing p{color:var(--muted)}
  .closing .sign{color:var(--navy);font-size:18px}
}
.print-only{display:none}
</style>
</head>

function readState(){
  const m=(location.hash.match(/[#&]p=([^&]+)/)||location.search.match(/[?&]p=([^&]+)/));
  if(!m||!window.LZString)return null;
  try{const json=LZString.decompressFromEncodedURIComponent(m[1]);return json?JSON.parse(json):null;}catch(e){return null;}
}
function fmtDate(d){
  const x=typeof d==='string'?new Date(d+'T00:00:00'):d;
  if(!x||isNaN(x))return '';
  return x.toLocaleDateString(U.locale,{day:'numeric',month:'long',year:'numeric'});
}
function expiryDate(){
  const m=(S.vd||'').match(/(\d+)\s*(יום|ימים|days?)/i);
  if(!m||!S.d)return null;
  const d=new Date(S.d+'T00:00:00'); d.setDate(d.getDate()+Number(m[1])); return d;
}
function text(f){ return (S.tx&&typeof S.tx[f]==='string')?S.tx[f]:(DEFAULT_CONTENT[S.l][f]||''); }
function linesOf(f){ return text(f).split('\n').map(s=>s.trim()).filter(Boolean); }
const vatify=n=>st.vat?n*(1+VAT):n;
function featKey(row){ if(row[2])return row[2]; return Object.keys(FEATURE_INFO).find(k=>FEATURE_INFO[k].l.includes(row[0]))||''; }
function featVal(key){ const r=(S.f||[]).find(r=>featKey(r)===key); return r?r[1]:undefined; }
function addonInfo(name){ return ADDON_INFO.find(x=>x.m.test(name||''))||null; }
function addonIdx(demo){ return S.ad.findIndex(a=>{const i=addonInfo(a.n);return i&&i.demo===demo;}); }
function initials(name){ const w=String(name||'A').replace(/["'״׳]/g,'').trim().split(/\s+/).filter(Boolean); return (w.length>1?w[0][0]+w[1][0]:(w[0]||'A').slice(0,2)).toUpperCase(); }

/* ── pricing. Main charge = package + payment + fixed custom lines (discount applies here only).
      Add-ons are a separate monthly charge: the add-on's annual price on annual billing, its monthly price otherwise. ── */
function calc(b){
  const an=b==='annual', D=an?S.da:S.dm, pct=(D&&D.p>0)?D.p:0;
  const lines=[]; let base=0, discBase=0;
  const add=(label,price,discountable)=>{lines.push({label,price});base+=price;if(pct&&discountable)discBase+=price;};
  add(U.pkgLine(S.pkg.n), an?S.pkg.a:S.pkg.m, D&&D.pkg);
  if(st.pay!=='none'){const p=S.pay.o[st.pay]; add(U.payLine(p.n), an?p.a:p.m, D&&D.pay);}
  (S.rc||[]).forEach(([n,p])=>add(n||U.service,p,false));
  const ad=[]; let adSum=0;
  S.ad.forEach((a,i)=>{ if(st.on[i]){const price=an?a.a:a.m; ad.push({label:a.n,price,detail:an?a.ua:a.um}); adSum+=price;} });
  const disc=discBase*pct/100;
  return {an,lines,base,disc,pct,period:D?D.n:0,now:base-disc,ad,adSum};
}

/* QR-looking pattern, seeded by the client's name so every proposal has its own */
function qrSVG(seedStr){
  const N=25; let seed=0; for(const ch of String(seedStr))seed=(seed*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  const finder=(x,y)=>x<7&&y<7||x>=N-7&&y<7||x<7&&y>=N-7;
  let r='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(!finder(x,y)&&rnd()<.48) r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" rx="1.6"/><rect x="${x+1}" y="${y+1}" width="5" height="5" rx="1.1" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".7"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" fill="#081838" aria-hidden="true">${r}${f(0,0)}${f(N-7,0)}${f(0,N-7)}</svg>`;
}

/* ── demo players ── */
const demos={};
function tapAt(scrEl,target){
  if(!scrEl||!target)return;
  const t=scrEl.querySelector('.tap'); const a=scrEl.getBoundingClientRect(), b=target.getBoundingClientRect();
  t.style.left=(b.left-a.left+b.width/2)+'px'; t.style.top=(b.top-a.top+b.height/2)+'px';
  t.classList.remove('go'); void t.offsetWidth; t.classList.add('go');
}
function makeDemos(){
  /* booking */
  const book={state:[]};
  book.reset=()=>{
    const C=U.book; book.state=C.classes.map(c=>({spots:c[3],booked:false}));
    const list=document.getElementById('ab-list'); if(!list)return;

    C.classes.forEach((c,i)=>book.paint(i));
    list.querySelectorAll('.cls-btn').forEach(b=>b.addEventListener('click',()=>book.toggle(+b.dataset.cls,true)));
    document.getElementById('ab-toast').classList.remove('show');
  };
  book.paint=i=>{
    const C=U.book, c=C.classes[i], s=book.state[i];

    meta.textContent=`${C.coach(c[2])}, ${s.spots>0?C.spots(s.spots):C.full}`;
    btn.className='cls-btn'+(s.booked?' done':''); btn.disabled=!s.booked&&s.spots<=0;
    btn.textContent=s.booked?C.joined:(s.spots<=0?C.full:C.join);
  };
  book.toggle=(i,user)=>{
    const s=book.state[i], C=U.book, c=C.classes[i];
    if(!s.booked&&s.spots<=0)return;
    s.booked=!s.booked; s.spots+=s.booked?-1:1; book.paint(i);
    const toast=document.getElementById('ab-toast');
    if(s.booked){toast.querySelector('span').textContent=C.toast(c[1],c[0]);toast.classList.add('show');clearTimeout(book.tt);book.tt=setTimeout(()=>toast.classList.remove('show'),2600);}
  };
  book.run=async stale=>{
    await sleep(900); if(stale())return;

  /* payment */

  };

  pay.open=()=>document.getElementById('pay-sheet').classList.add('open');
  pay.pay=async()=>{
    if(pay.busy)return; pay.busy=true;
    document.getElementById('pay-btn').innerHTML=`<span class="spin"></span>${U.pay.paying}`;
    await sleep(1300);
    document.getElementById('pay-done').classList.add('show');
  };
  pay.run=async stale=>{
    await sleep(900); if(stale())return;
    const link=document.getElementById('pay-link'); tapAt(link.closest('.scr'),link); await sleep(250); if(stale())return; pay.open();
    await sleep(1300); if(stale())return;
    const btn=document.getElementById('pay-btn'); tapAt(btn.closest('.scr'),btn); await sleep(200); if(stale())return; pay.pay();
  };
  demos.pay=pay;
  const pl=document.getElementById('pay-link');
  if(pl){
    pl.addEventListener('click',()=>pay.open());
    document.querySelectorAll('#pay-sheet .sh-m').forEach(b=>b.addEventListener('click',()=>pay.method(b.dataset.m)));

  }

  /* whatsapp reminders */
  const wa={};
  const C2=U.wa2, n=U.customer;
  wa.reset=()=>{const b=document.getElementById('wa-body'); if(b)b.innerHTML=`<span class="wa-day">${C2.today}</span>`;};
  wa.add=html=>{const b=document.getElementById('wa-body'); b.insertAdjacentHTML('beforeend',html); return b.lastElementChild;};

    await sleep(500); if(stale())return;
    if(!await wa.typing(1100,stale))return;
    wa.add(`<div class="bub">${esc(C2.m1(n))}<time>20:00</time></div>`);
    await sleep(1400); if(stale())return;
    wa.add(`<div class="bub me">${esc(C2.r1)}<time>20:03</time></div>`);
    await sleep(1200); if(stale())return;
    if(!await wa.typing(1100,stale))return;
    wa.add(`<div class="bub">${esc(C2.m2(n))}<span class="lnk">${C2.m2link}</span><time>20:05</time></div>`);
  };
  demos.wa2=wa;

  /* access */
  const acc={};
  acc.reset=()=>{const b=document.getElementById('acc-beam'); if(!b)return; b.classList.remove('go'); document.getElementById('acc-ok').classList.remove('show');};
  acc.run=async stale=>{
    await sleep(600); if(stale())return;
    const b=document.getElementById('acc-beam'); void b.offsetWidth; b.classList.add('go');
    await sleep(3000); if(stale())return;
    const ok=document.getElementById('acc-ok'); ok.classList.add('show');
    await sleep(2600); if(stale())return;
    ok.classList.remove('show');
  };
  demos.access=acc;

  /* Claude + Arbox */
  const ai={};
  const A=U.ai;
  ai.body=()=>document.getElementById('ai-body');
  ai.reset=()=>{const b=ai.body(); if(!b)return; b.innerHTML=''; const i=document.getElementById('ai-in'); i.textContent=A.input; i.classList.remove('on');};
  ai.add=html=>{const b=ai.body(); b.insertAdjacentHTML('beforeend',html); b.scrollTop=b.scrollHeight; return b.lastElementChild;};
  ai.type=async(txt,stale)=>{
    const i=document.getElementById('ai-in'); i.classList.add('on'); i.textContent='';
    for(const ch of txt){ if(stale())return false; i.textContent+=ch; await sleep(32); }
    await sleep(350); if(stale())return false;

  };
  ai.tool=async(name,stale)=>{
    const t=ai.add(`<div class="ai-tool"><span class="spin"></span><img src="${LOGO}" alt="">${esc(name)}</div>`);
    await sleep(1300); if(stale())return false;
    t.querySelector('.spin').outerHTML='<span class="ok">✓</span>'; return true;
  };
  ai.run=async stale=>{
    await sleep(600); if(stale())return;

    await sleep(400); if(stale())return;
    if(!await ai.tool(A.tool1,stale))return;

    await sleep(2200); if(stale())return;
    if(!await ai.type(A.q2,stale))return;
    await sleep(400); if(stale())return;
    if(!await ai.tool(A.tool2,stale))return;

    ai.add(`<div class="ai-a">${esc(A.a2)}<div class="ai-card"><div class="ai-cal">${esc(A.card[0])}<b>19:00</b></div><div><b>${esc(A.card[1])}</b><span>${esc(A.card[2])}</span></div></div></div>`);
  };
  demos.ai=ai;

  /* dashboard */
  const dash={};
  dash.reset=()=>{
    document.querySelectorAll('#dev-dash .bar i').forEach(i=>i.style.height='0');
    document.querySelectorAll('#dev-dash .js-kpi').forEach(k=>k.textContent=k.dataset.money==='1'?money(0):'0');
  };
  dash.run=async stale=>{
    await sleep(300); if(stale())return;
    document.querySelectorAll('#dev-dash .bar i').forEach((i,ix)=>setTimeout(()=>{i.style.height=i.dataset.h+'%';},reduceMotion?0:ix*90));
    document.querySelectorAll('#dev-dash .js-kpi').forEach(k=>{
      const to=+k.dataset.v, isM=k.dataset.money==='1', t0=performance.now(), dur=reduceMotion?0:1100;
      const step=t=>{const p=dur?Math.min(1,(t-t0)/dur):1, e=1-Math.pow(1-p,3), v=to*e; k.textContent=isM?money(v):fmt(v); if(p<1&&!stale())requestAnimationFrame(step);};

}
function playDemo(id){
  const d=demos[id]; if(!d||!d.run)return;
  d.token=(d.token||0)+1; const tok=d.token;
  d.reset(); d.run(()=>tok!==d.token);
}
function bindShowcase(){
  makeDemos();
  Object.keys(demos).forEach(id=>{ if(document.getElementById('dev-'+id)) demos[id].reset(); });
  document.querySelectorAll('[data-replay]').forEach(b=>b.addEventListener('click',()=>playDemo(b.dataset.replay)));
  document.querySelectorAll('[data-addon-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.addonToggle; st.on[i]=!st.on[i];
    const cb=document.querySelector(`[data-ad="${i}"] input`); if(cb)cb.checked=st.on[i];
    update();
  }));
  document.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click',()=>{
    document.getElementById('br').style.setProperty('--brand',s.dataset.color);
    document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',String(x===s)));
  }));
  const devs=document.querySelectorAll('.show-dev');
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); playDemo(e.target.id.slice(4));} }),{threshold:.6});
    devs.forEach(d=>io.observe(d));
  }else devs.forEach(d=>playDemo(d.id.slice(4)));
}

/* ════════════════ BEHAVIOUR ════════════════ */
function bind(){
  document.querySelectorAll('input[name=billing]').forEach(r=>{r.checked=r.value===st.b; r.addEventListener('change',()=>{st.b=r.value;update();});});
  document.querySelectorAll('input[name=pay]').forEach(r=>{r.checked=r.value===st.pay; r.addEventListener('change',()=>{st.pay=r.value;update();});});
  document.querySelectorAll('[data-ad] input').forEach(c=>{const i=+c.value; c.checked=st.on[i]; c.addEventListener('change',()=>{st.on[i]=c.checked;update();});});
  const v=document.getElementById('vat'); v.checked=st.vat; v.addEventListener('change',()=>{st.vat=v.checked;update();});
  const bar=document.getElementById('bar'), sum=document.getElementById('sum');
  if('IntersectionObserver' in window&&bar&&sum){
    new IntersectionObserver(es=>es.forEach(e=>bar.classList.toggle('hide',e.isIntersecting)),{threshold:.25}).observe(sum);
  }
  window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
  bindShowcase();
}

function update(animate=true){
  const c=calc(st.b), an=c.an, bp=an?'a':'m';
  document.querySelectorAll('[data-pay]').forEach(el=>el.classList.toggle('is-on',el.dataset.pay===st.pay));
  document.querySelectorAll('[data-ad]').forEach(el=>el.classList.toggle('is-on',!!st.on[+el.dataset.ad]));
  document.querySelectorAll('.js-bp').forEach(el=>el.textContent=money(vatify(+el.dataset[bp])));
  document.querySelectorAll('.js-ud').forEach(el=>{el.textContent=el.dataset[bp]||'';});
  document.querySelectorAll('.js-ot').forEach(el=>{const v=+el.dataset.v; el.textContent=v?money(vatify(v)):U.free;});
  document.querySelectorAll('[data-show-if]').forEach(sec=>{
    const vis=!!st.on[+sec.dataset.showIf], was=!sec.hidden; sec.hidden=!vis;
    if(vis&&!was&&animate&&demos[sec.dataset.demo]) playDemo(sec.dataset.demo);
  });
  document.querySelectorAll('[data-addon-toggle]').forEach(b=>{const on=!!st.on[+b.dataset.addonToggle]; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on)); b.textContent=on?U.addedAddon:U.addAddon;});
  document.getElementById('print-billing').textContent=U.printBilling(st.b);
  const bn=document.getElementById('bill-note-t'); if(bn)bn.textContent=an?U.addonsBillA:U.addonsBill;

  // annual saving (list prices, before any discount), including the selected add-ons
  const cm=calc('monthly'), ca=calc('annual');
  const save=(cm.base-ca.base+cm.adSum-ca.adSum)*12;
  document.getElementById('save-note').textContent=save>0?U.save(money(vatify(save))):'';

  // main charge
  const headline=c.disc>0?c.now:c.base;
  document.getElementById('sum-plan').textContent=U.sumPlan(S.pkg.n,st.b);
  animateNum(document.getElementById('sum-num'),vatify(headline),animate);
  document.getElementById('sum-unit').textContent=`${an?U.unitA:U.unitM}, ${st.vat?U.vatIn:U.vatEx}`;
  const was=document.getElementById('sum-was'), deal=document.getElementById('sum-deal'), ann=document.getElementById('sum-annual');
  if(c.disc>0){
    was.hidden=false; was.textContent=U.was(money(vatify(c.base)));
    deal.hidden=false; deal.textContent=(an?U.dealA:U.dealM)(c.pct,c.period,money(vatify(c.base)));
  }else{was.hidden=true;deal.hidden=true;}
  if(an){ann.hidden=false; ann.textContent=U.annualPay(money(vatify(headline*12)));}else ann.hidden=true;
  let rows=c.lines.map(l=>`<div class="r"><span>${esc(l.label)}</span><span>${money(vatify(l.price))}</span></div>`).join('');
  if(c.disc>0) rows+=`<div class="r disc"><span>${esc(U.discLine(c.pct))}</span><span><bdi dir="ltr">−${money(vatify(c.disc))}</bdi></span></div>`;
  document.getElementById('sum-list').innerHTML=rows;

  // add-ons: separate monthly charge
  const sa=document.getElementById('sum-ad');
  if(c.ad.length){
    sa.hidden=false;
    sa.innerHTML=`<h4>${U.adTitle}</h4><p class="hint">${U.adHint}</p>`+
      c.ad.map(a=>`<div class="r"><span>${esc(a.label)}${a.detail?` <span style="opacity:.7">(${esc(a.detail)})</span>`:''}</span><span><bdi dir="ltr">+${money(vatify(a.price))}</bdi></span></div>`).join('')+
      `<div class="r tot"><span>${U.adTotal}</span><span><bdi dir="ltr">+${money(vatify(c.adSum))}</bdi> ${U.perMonth}</span></div>`+
      (an?'':`<div class="grand">${U.adGrand(money(vatify(headline+c.adSum)))}</div>`);
  }else sa.hidden=true;

  const extra=[]; const p=S.pay.o[st.pay];
  if(st.pay==='grow'&&p.xm) extra.push(`${esc(U.directTitle)}: <strong>${money(p.xm)}</strong> ${U.perMonth}`);
  if(st.pay==='pelecard'&&p.xm) extra.push(`${esc(U.directTitle)}: <strong>${money(p.xm)}</strong> ${U.perMonth} + <strong>${money(p.xs)}</strong>`);
  const otv=(S.ot||[]).reduce((s,[,v])=>s+(v||0),0);
  if(otv>0) extra.push(U.onetimeSum(money(vatify(otv))));
  const ex=document.getElementById('sum-extra'); ex.hidden=!extra.length; ex.innerHTML=extra.map(x=>`<div>${x}</div>`).join('');

  document.getElementById('bar-num').textContent=money(vatify(headline));
  document.getElementById('bar-ad').textContent=c.ad.length?U.barAd(money(vatify(c.adSum))):'';

  const msg=U.wa({rep:S.r,client:S.c,pkg:S.pkg.n,billing:st.b,
    pay:st.pay==='none'?'':S.pay.o[st.pay].n,
    addons:c.ad.map(a=>a.label), adPrice:money(vatify(c.adSum)),
    price:money(vatify(headline)),vat:st.vat,url:location.href});
  const href=`https://wa.me/${S.ph||''}?text=${encodeURIComponent(msg)}`;
  document.getElementById('cta').href=href; document.getElementById('cta2').href=href;
}

function animateNum(el,to,animate){
  const from=shownPrice==null?to:shownPrice; shownPrice=to;
  if(!animate||reduceMotion||from===to){el.textContent=money(to);return;}
  const t0=performance.now(), dur=380;
  const step=t=>{const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=money(from+(to-from)*e); if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

function printProposal(){ document.querySelectorAll('details').forEach(d=>d.open=true); window.print(); }

function renderInvalid(){
  document.getElementById('app').innerHTML=`<div class="invalid"><div><img src="${LOGO}" alt="Arbox" class="logo" style="margin:0 auto;height:34px"><p>${T.he.invalid}<br><span style="color:#5A6377;font-size:15px">${T.en.invalid}</span></p></div></div>`;
}

(function init(){
  S=readState();
  if(!S||!S.pkg||!S.pay){renderInvalid();return;}
  S.l=S.l==='en'?'en':'he';
  S.ad=S.ad||[];
  U=T[S.l];
  document.documentElement.lang=S.l; document.documentElement.dir=U.dir;
  document.title=U.title(S.c);
  const payKey=S.pay.o[S.pay.s]?S.pay.s:'none';
  st={b:S.b==='annual'?'annual':'monthly', pay:payKey, on:S.ad.map(a=>!!a.on), vat:!!S.vat};
  render(); bind(); update(false);
})();
